<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - CSRF 취약점 실습</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: #fff; padding: 35px 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-card h2 { margin-bottom: 20px; color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #555; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #3498db; }
        .btn-submit { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 5px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #2980b9; }
        .flash-msg { padding: 10px 15px; border-radius: 5px; margin-bottom: 15px; font-size: 14px; }
        .flash-msg.danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .flash-msg.info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .flash-msg.warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .flash-msg.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .hint-box { margin-top: 20px; padding: 12px; background: #eef2f7; border-left: 4px solid #3498db; border-radius: 4px; font-size: 13px; color: #666; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔐 로그인</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-msg {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">사용자명 (Username)</label>
                <input type="text" id="username" name="username" value="alice" required>
            </div>
            <div class="form-group">
                <label for="password">비밀번호 (Password)</label>
                <input type="password" id="password" name="password" value="password123" required>
            </div>
            <button type="submit" class="btn-submit">로그인</button>
        </form>

        <div class="hint-box">
            <strong>테스트 계정 정보:</strong><br>
            • 아이디: <code>alice</code><br>
            • 비밀번호: <code>password123</code>
        </div>
    </div>
</body>
</html>
